name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        name: Test on Python ${{ matrix.python-version }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]
        env:
            MISE_GITHUB_ATTESTATIONS: "false"

        steps:
            - uses: actions/checkout@v7

            - name: Install mise
              uses: jdx/mise-action@v5.1.1
              with:
                  version: 2026.10.2
                  cache: true
                  install: false

            - name: Setup Python via mise
              run: |
                  mise use python@${{ matrix.python-version }}
                  mise install

            - name: Install dependencies
              run: |
                  mise exec -- uv sync --all-extras --all-groups

            - name: Run format check
              run: mise run format

            - name: Run lint
              run: mise run lint

            - name: Run type check
              run: mise run typecheck

            - name: Run tests with coverage
              run: mise run test --coverage

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              if: matrix.python-version == '3.13'
              with:
                  files: ./coverage.xml
                  fail_ci_if_error: false
                  token: ${{ secrets.CODECOV_TOKEN }}

    minimum-dependencies:
        name: Test with lowest declared dependency versions
        runs-on: ubuntu-latest
        env:
            MISE_GITHUB_ATTESTATIONS: "false"

        steps:
            - uses: actions/checkout@v7

            - name: Install mise
              uses: jdx/mise-action@v5.1.1
              with:
                  version: 2026.10.2
                  cache: true
                  install: false

            - name: Setup Python via mise
              run: |
                  mise use python@3.12
                  mise install

            - name: Run tests against the lowest declared versions
              run: |
                  mise exec -- uv run --isolated --no-project \
                      --python 3.12 \
                      --resolution lowest-direct \
                      --with . --with "pytest>=8.3.5" \
                      pytest tests/

    build:
        name: Build package
        runs-on: ubuntu-latest
        needs: [test, minimum-dependencies]
        env:
            MISE_GITHUB_ATTESTATIONS: "false"

        steps:
            - uses: actions/checkout@v7

            - name: Install mise
              uses: jdx/mise-action@v5.1.1
              with:
                  version: 2026.10.2
                  cache: true
                  install: false

            - name: Setup Python via mise
              run: |
                  mise use python@3.13
                  mise install

            - name: Install dependencies
              run: |
                  mise exec -- uv sync --all-extras --all-groups

            - name: Build package
              run: mise run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
